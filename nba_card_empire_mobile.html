.panel,.glasspanel,.tier,.hero,.topbar,.nav,.statpill,.team,.slot,.odds-panel{background:rgba(12,15,18,.48)!important;border-color:rgba(225,230,235,.18)!important;backdrop-filter:blur(22px) saturate(115%);box-shadow:0 14px 38px rgba(0,0,0,.2)}

/* glass design pass */

async function loadHeadshotCrosswalk(){
 if(typeof fetch!=='function')return;
 const uniqueCandidates=new Map();
 const addCandidate=(name,id)=>{if(!name||!id)return;const key=normPlayerName(name);if(!key)return;const set=uniqueCandidates.get(key)||new Set();set.add(Number(id));uniqueCandidates.set(key,set)};
 const sources=[
  fetch('https://raw.githubusercontent.com/bttmly/nba/master/data/players.json').then(r=>{if(!r.ok)throw new Error('player crosswalk unavailable');return r.json()}).then(rows=>{rows.forEach(p=>addCandidate(`${p.firstName||''} ${p.lastName||''}`,p.playerId))}),
  fetch('https://gist.githubusercontent.com/hdurix/c83df92b0385c7d3d4c033bfd34e4909/raw/3ad0c34c1feb7051d966a99cac3b09af739cfb5a/gistfile1.txt').then(r=>{if(!r.ok)throw new Error('player index unavailable');return r.json()}).then(data=>{const set=data.resultSets?.find(x=>x.name==='PlayerIndex');if(!set)return;const h=set.headers||[],idI=h.indexOf('PERSON_ID'),firstI=h.indexOf('PLAYER_FIRST_NAME'),lastI=h.indexOf('PLAYER_LAST_NAME');if(idI<0||firstI<0||lastI<0)return;(set.rowSet||[]).forEach(row=>addCandidate(`${row[firstI]||''} ${row[lastI]||''}`,row[idI]))})
 ];
 await Promise.allSettled(sources);
 let added=0;
 for(const [key,ids] of uniqueCandidates){if(ids.size!==1)continue;const id=[...ids][0];if(!id)continue;if(!Object.keys(nbaHeadshots).some(n=>normPlayerName(n)===key)){nbaHeadshots[key]=id;added++}}
 if(added&&['home','collection','roster','market'].includes(currentTab)&&!document.getElementById('modalroot')?.innerHTML){if(currentTab==='collection')renderCollectionKeep();else render()}
}

function packsHTML(){if(selectedCat==='retro80')selectedCat='rosters';let storeCategories=categories.filter(c=>c.id!=='retro80');let cat=categories.find(c=>c.id===selectedCat);let team=teams.find(t=>t[0]===selectedTeam);let price=packCost(selectedCat);let odds=currentOdds(selectedCat,cat.team?selectedTeam:'ALL');let oddsText=Object.entries(odds).map(([r,v])=>`${r} ${v}%`).join(' · ');return `${header('pack store','select a collection · one pack per category · higher price means stronger pool')}<div class="grid">${storeCategories.map(c=>`<button class="panel collection-choice ${c.id==='retro80'?'retro-pack-choice':''}" style="text-align:left;border-color:${selectedCat===c.id?'rgba(255,255,255,.5)':'var(--line)'}" onclick="selectedCat='${c.id}';render()"><div class="eyebrow">${c.team?'team-specific pool':'universal pool'}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="collection-price">${fmt(packCost(c.id))}</div><div class="sub">base ${fmt(packPrices[c.id])} · after discount</div></button>`).join('')}</div>${cat.team?`<div class="glasspanel" style="margin-top:16px"><div class="eyebrow">select franchise</div><h3>${team?team[1]:'choose a team'}</h3><div class="teamgrid">${teams.map(t=>`<button class="team ${selectedTeam===t[0]?'selected':''}" onclick="selectedTeam='${t[0]}';render()"><span class="abbr">${t[0]}</span>${t[1]}</button>`).join('')}</div></div>`:`<div class="glasspanel" style="margin-top:16px"><div class="eyebrow">universal player pool</div><h3>${cat.id==='top100'?'top 100 ranked cards · rank 1 is the rarest':cat.id==='retro80'?'80s legends · exclusive themed cards · ranked rarity pool':'all active players · all teams'}</h3><p>${cat.desc}</p></div>`}<div class="packtiers"><div class="tier glasspanel"><div class="eyebrow">pack quantity</div><div class="toolbar" style="justify-content:center">${[1,5,10].map(q=>`<button class="button ${state.packQty===q?'':'secondary'} small" onclick="state.packQty=${q};save();render()">×${q}</button>`).join('')}</div><div class="eyebrow">${state.packQty===1?'single pack':state.packQty+' pack bundle'}</div><div class="tiername">${cat.name}</div><div class="price">${fmt(price*state.packQty)}</div><div class="chance">${cat.team?(team?team[1]+' player pool':'select a team first'):'no team selection required'}</div><button class="button full" ${state.cash<price*state.packQty||cat.team&&!team?'disabled':''} onclick="openPackQuantity('${selectedCat}','${cat.team?selectedTeam:'ALL'}',${state.packQty})">open ${state.packQty} pack${state.packQty===1?'':'s'}</button></div></div><div class="glasspanel odds-panel" style="margin-top:16px"><div class="eyebrow">exact pull probabilities · per pack</div><h3>rarity odds</h3><div class="oddsgrid">${Object.entries(odds).map(([r,v])=>`<div class="odd"><span class="rarity ${r}">${r}</span><strong>${v}%</strong></div>`).join('')}</div><p class="sub">these are the current odds including your pack luck upgrade. a rarity is rolled first, then a matching card is selected from the selected pool.</p></div>`}
function rosterHTML(){let slots=state.roster.map((id,i)=>{let p=id&&getCard(id);return `<div class="slot ${p?'filled':''}"><b>${i<5?'starter':'bench'} ${i+1}</b>${p?`<div class="slotname">${p.name}</div><div class="slotovr">${p.ovr} OVR</div><div class="income">${fmt(incomeOf(p))}/s</div><button class="button small secondary" style="margin-top:7px" onclick="unequip(${i})">remove</button>`:`<div class="slotname muted">empty</div>`}</div>`}).join('');let owned=Object.keys(state.owned).filter(id=>state.owned[id]>0).map(getCard).sort((a,b)=>b.ovr-a.ovr);return `${header('roster management','choose 5 starters and 5 bench players · starters earn a 15% bonus')}<div class="panel"><div class="eyebrow">active lineup · ${fmt(rosterIncome())}/second</div><div class="slots">${slots}</div><div class="toolbar"><button class="button secondary" onclick="autoRoster()">auto fill best roster</button><button class="button ghost" onclick="clearRoster()">clear lineup</button></div></div><div style="margin-top:22px">${header('your cards','click a card to equip it into the next empty slot')}</div><div class="collectiongrid">${owned.length?owned.map(p=>`<div onclick="equip('${p.id}')" style="cursor:pointer">${cardHTML(p)}<button class="button secondary small full" onclick="event.stopPropagation();equip('${p.id}')">equip card</button></div>`).join(''):`<div class="empty">you have no cards yet — open a pack to get started</div>`}</div>`}
function collectionHTML(){let filter=document.getElementById('filter')?.value||'all';let search=document.getElementById('search')?.value||'';let list=players.filter(p=>(filter==='all'||p.rarity===filter)&&(p.name.toLowerCase().includes(search.toLowerCase())||p.team.toLowerCase().includes(search.toLowerCase())));return `${header('collection book','every card in the current database · duplicates are tracked')}<div class="toolbar"><input id="search" placeholder="search player or team" value="${search}" oninput="renderCollectionKeep()"><select id="filter" onchange="renderCollectionKeep()" class="select"><option value="all">all rarities</option>${rarityList.map(r=>`<option ${filter===r?'selected':''} value="${r}">${r}</option>`).join('')}</select><span class="sub">${Object.keys(state.owned).length}/${players.length} unique · ${totalCards()} total cards</span></div><div class="collectiongrid">${list.map(p=>state.owned[p.id]?`<div>${cardHTML(p)}<div class="sub" style="margin-top:5px;text-align:center">owned ×${state.owned[p.id]}</div>${duplicateCount(p.id)>0?`<button class="button secondary small full" onclick="sellDuplicate('${p.id}')">sell extra · ${fmt(sellValue(p))}</button>`:''}</div>`:`<div class="card" style="opacity:.32;filter:grayscale(1)"><div class="rarity">undiscovered</div><div class="portrait">?</div><div><div class="cardname">unknown player</div><div class="cardmeta">${p.team} · hidden</div><div class="cardfoot"><div class="ovr">??</div><div class="income">locked</div></div></div></div>`).join('')}</div>`}

function duplicateCount(id){return Math.max(0,(state.owned[id]||0)-(state.roster.includes(id)?1:0));}
function sellValue(p){return Math.max(1,Math.floor((p.baseIncome*9+Math.pow(p.ovr,2))*((rarityIncomeMultiplier[p.rarity]||1)*0.12)*(1+state.upgrades.market*.12)*(1+(state.facilities.market||0)*.08)));}
function sellDuplicate(id){let p=getCard(id);if(!p||duplicateCount(id)<1){toast('no sellable duplicate');return}state.owned[id]--;ensureMissions();state.missions.progress.sales++;state.stats.sales++;state.season.xp+=2;state.cash+=sellValue(p);if(state.owned[id]<=0)delete state.owned[id];save();render();toast(`sold duplicate · +${fmt(sellValue(p))}`)}
function sellAllDuplicates(){let count=0,total=0;players.forEach(p=>{let n=duplicateCount(p.id);if(n>0){count+=n;total+=n*sellValue(p);ensureMissions();state.missions.progress.sales+=n;state.stats.sales+=n;state.season.xp+=2*n;state.owned[p.id]-=n;if(state.owned[p.id]<=0)delete state.owned[p.id]}});if(!count){toast('no duplicates to sell');return}state.cash+=total;save();render();toast(`sold ${count} duplicates · +${fmt(total)}`)}
function marketHTML(){let sellables=players.filter(p=>duplicateCount(p.id)>0).sort((a,b)=>sellValue(b)-sellValue(a));let dupes=sellables.reduce((n,p)=>n+duplicateCount(p.id),0);let estimate=sellables.reduce((n,p)=>n+duplicateCount(p.id)*sellValue(p),0);return `${header('card market','trade extras for cash · equipped copies and one copy of each player are protected')}<div class="grid"><div class="panel"><div class="eyebrow">duplicate inventory</div><h3>${dupes} sellable cards</h3><p>estimated liquidation value ${fmt(estimate)}</p><button class="button full" onclick="sellAllDuplicates()" ${dupes?'':'disabled'}>sell all duplicates · ${fmt(estimate)}</button></div><div class="panel"><div class="eyebrow">market upgrade</div><h3>dealer reputation · level ${state.upgrades.market}</h3><p>increases duplicate sale prices by 12% per level</p><button class="button secondary full" onclick="buyMarketUpgrade()">upgrade · ${fmt(marketUpgradeCost())}</button></div><div class="panel"><div class="eyebrow">collection protection</div><h3>sell rules</h3><p>you can never sell your last copy or a card currently equipped in your lineup. bulk selling only removes extras.</p></div></div><div class="collectiongrid" style="margin-top:15px">${sellables.map(p=>`<div>${cardHTML(p)}<div class="panel" style="margin-top:6px;padding:10px"><div class="sub">duplicates available ×${duplicateCount(p.id)}</div><button class="button secondary full" onclick="sellDuplicate('${p.id}')">sell 1 · ${fmt(sellValue(p))}</button></div></div>`).join('')||'<div class="empty">no duplicates yet · open more packs</div>'}</div>`}
function marketUpgradeCost(){return Math.floor(12000*Math.pow(2.15,state.upgrades.market))}
function buyMarketUpgrade(){let cost=marketUpgradeCost();if(state.cash<cost){toast('not enough cash');return}state.cash-=cost;state.upgrades.market++;save();render();toast('dealer reputation upgraded')}
function upgradesHTML(){let nodes=[{id:'income',name:'cash engine',desc:'+15% income per level',base:600,step:2,max:50,branch:'economy'},{id:'luck',name:'pack scouting',desc:'improves odds slightly · capped to prevent rarity inflation',base:1000,step:2,max:20,branch:'packs'},{id:'offline',name:'offline vault',desc:'raises offline earning cap',base:1200,step:2,max:24,branch:'economy'},{id:'discount',name:'bulk contracts',desc:'reduces all pack prices by 3% per level',base:2500,step:2,max:10,branch:'packs'},{id:'critIncome',name:'sponsorship deals',desc:'+5% team income per level',base:8000,step:2.25,max:20,branch:'economy'},{id:'packSpeed',name:'rapid opening',desc:'shortens common pack reveal sequence',base:15000,step:2.4,max:8,branch:'packs'},{id:'starterBonus',name:'starting five synergy',desc:'+3% starter-slot earnings per level',base:18000,step:2.35,max:15,branch:'lineup'},{id:'offlineBoost',name:'overnight manager',desc:'+10% offline earnings per level',base:22000,step:2.3,max:15,branch:'economy'},{id:'collectionBonus',name:'collector prestige',desc:'+2% income per unique card owned',base:30000,step:2.5,max:10,branch:'collection'}];return `${header('empire skill tree','invest in separate branches · every upgrade has a level cap')}<div class="skillbranches">${['economy','packs','lineup','collection'].map(branch=>`<section class="skillbranch panel"><div class="eyebrow">${branch} branch</div><div class="skillnodes">${nodes.filter(n=>n.branch===branch).map(n=>{let level=state.upgrades[n.id]||0,cost=Math.floor(n.base*Math.pow(n.step,level));return `<div class="skillnode"><div class="eyebrow">level ${level}/${n.max}</div><h3>${n.name}</h3><p>${n.desc}</p><div class="cost">${level>=n.max?'maxed':fmt(cost)}</div><button class="button ${level>=n.max?'ghost':'secondary'} full" ${state.cash<cost||level>=n.max?'disabled':''} onclick="buyUpgrade('${n.id}',${cost},${n.max})">${level>=n.max?'max level':'unlock next level'}</button></div>`}).join('')}</div></section>`).join('')}</div><div class="panel" style="margin-top:15px"><h3>save controls</h3><p>progress saves automatically in this browser</p><div class="toolbar" style="margin-top:12px"><button class="button secondary" onclick="save();toast('game saved')">save now</button><button class="button ghost" onclick="resetGame()">reset game</button><button class="button ghost" onclick="creatorUnlock()">creator console</button></div></div>`}

function achievementsHTML(){return `${header('achievement hall','milestones · claim rewards · progress carries over')}<div class="feature-grid"><div class="feature-card"><div class="eyebrow">completion</div><div class="big">${achievementDefs.filter(a=>state.achievements[a.id]).length}/${achievementDefs.length}</div><p>achievements claimed</p></div><div class="feature-card"><div class="eyebrow">season xp</div><div class="big">${state.season.xp}</div><p>level ${seasonLevel()} · ${seasonProgress()}% progress</p></div></div><h2>achievement rewards</h2><div class="operations-grid">${achievementDefs.map(a=>{let n=Math.min(a.goal,a.stat()),claimed=!!state.achievements[a.id],ready=n>=a.goal;return `<div class="feature-card achievement ${ready&&!claimed?'ready':''}"><div class="eyebrow">${claimed?'claimed':ready?'reward ready':'milestone'}</div><h3>${a.title}</h3><p>${a.desc}</p><div class="progress"><span style="width:${Math.min(100,n/a.goal*100)}%"></span></div><div class="toolbar" style="justify-content:space-between;margin-top:9px"><span class="sub">${n.toLocaleString()}/${a.goal.toLocaleString()} · ${fmt(a.reward)}</span><button class="button small secondary" ${!ready||claimed?'disabled':''} onclick="claimAchievement('${a.id}')">${claimed?'claimed':'claim'}</button></div></div>`}).join('')}</div><h2>season pass rewards</h2><div class="pass-track">${seasonRewards.map((r,i)=>{let lv=i+1,claimed=!!state.season.claimed[lv];return `<div class="pass-node ${claimed?'claimed':''}"><div class="eyebrow">level ${lv}</div><strong>${fmt(r)}</strong><p class="sub">cash reward</p><button class="button small secondary full" ${seasonLevel()<lv||claimed?'disabled':''} onclick="claimSeasonReward(${lv})">${claimed?'claimed':seasonLevel()>=lv?'claim':'locked'}</button></div>`}).join('')}</div>`}
function claimAchievement(id){let a=achievementDefs.find(x=>x.id===id);if(!a||state.achievements[id]||a.stat()<a.goal)return toast('achievement not ready');state.achievements[id]=true;state.cash+=a.reward;state.season.xp+=20;save();render();toast(`achievement claimed · ${fmt(a.reward)}`)}
function trainingCost(id){let lv=state.training[id]||0;return Math.floor(15000*Math.pow(2.05,lv))}
function trainCard(id){let p=getCard(id);if(!p)return;let lv=state.training[id]||0,c=trainingCost(id);if(lv>=10)return toast('card reached training cap');if(state.cash<c)return toast('not enough cash');state.cash-=c;state.training[id]=lv+1;state.stats.trained++;state.season.xp+=10;save();render();toast(`${p.name} trained · +1 OVR`)}
function trainingHTML(){let owned=Object.keys(state.owned).map(getCard).filter(Boolean).sort((a,b)=>((state.training[b.id]||0)-(state.training[a.id]||0))||b.ovr-a.ovr);return `${header('player development','train owned cards · +1 ovr and +8% card income per level · max 10')}<div class="feature-grid"><div class="feature-card"><div class="eyebrow">training center</div><div class="big">${state.stats.trained}</div><p>training sessions completed</p></div><div class="feature-card"><div class="eyebrow">training philosophy</div><h3>no card left behind</h3><p>training is permanent and applies to every copy of that card you own</p></div></div><div class="panel">${owned.length?owned.map(p=>{let lv=state.training[p.id]||0,c=trainingCost(p.id);return `<div class="training-row"><div><strong>${p.name}</strong><div class="sub">${p.team} · ${p.ovr} base ovr · ${lv}/10 training · income ${fmt(incomeOf(p))}/s</div><div class="progress"><span style="width:${lv*10}%"></span></div></div><div><button class="button secondary" ${lv>=10||state.cash<c?'disabled':''} onclick="trainCard('${p.id}')">${lv>=10?'maxed':'train · '+fmt(c)}</button></div></div>`}).join(''):'<div class="empty">open packs to unlock players for training</div>'}</div>`}
function prestigeHTML(){let uniques=Object.keys(state.owned).length,threshold=30,ready=uniques>=threshold&&state.cash>=10000000000;let gain=Math.max(1,Math.floor(uniques/30));return `${header('dynasty prestige','restart your cash empire for permanent legacy tokens · cards stay with you')}<div class="feature-grid"><div class="feature-card"><div class="eyebrow">legacy tokens</div><div class="big">${state.prestige.tokens}</div><p>+3% permanent income per token</p></div><div class="feature-card"><div class="eyebrow">dynasties created</div><div class="big">${state.prestige.count}</div><p>prestige runs completed</p></div><div class="feature-card"><div class="eyebrow">requirements</div><h3>${uniques}/${threshold} unique cards</h3><p>${fmt(state.cash)}/$10B cash</p><div class="progress"><span style="width:${Math.min(100,uniques/threshold*100)}%"></span></div></div></div><div class="panel"><h2>start a new dynasty</h2><p>prestige resets your cash, skill tree, facility levels and roster slots. your cards, collection, training, achievements and daily progress stay. earn ${gain} legacy token${gain===1?'':'s'} from your unique collection.</p><p class="sub">each token permanently adds 3% income to every card</p><button class="button" ${ready?'':'disabled'} onclick="doPrestige()">${ready?'prestige · earn '+gain+' tokens':'requirements not met'}</button></div>`}
function doPrestige(){let u=Object.keys(state.owned).length;if(u<30||state.cash<10000000000)return toast('prestige requirements not met');let gain=Math.max(1,Math.floor(u/30));if(!confirm(`prestige now for ${gain} legacy tokens? cash, skill upgrades, facilities and lineup reset. collection and training stay.`))return;state.prestige.tokens+=gain;state.prestige.count++;state.cash=450;state.roster=Array(10).fill(null);state.upgrades=fresh().upgrades;state.facilities={academy:0,scouting:0,arena:0,market:0};state.season.xp+=100;save();render();toast(`dynasty reset · +${gain} legacy tokens`)}

function openPackQuantity(cat,team,qty){if(qty<=1)return openPack(cat,team);let price=packCost(cat),total=price*qty;if(state.cash<total)return toast('not enough cash for bundle');let pool=poolFor(cat,team);if(!pool.length)return toast('no players available in this pack yet');let mapped=effectiveRarityWeights(cat,pool),pulled=[];state.cash-=total;ensureMissions();state.missions.progress.packs+=qty;state.stats.packs+=qty;state.season.xp+=qty*5;for(let k=0;k<qty;k++){let roll=Math.random(),rarity=Object.keys(mapped)[0];for(let r of Object.keys(mapped)){roll-=mapped[r];if(roll<=0){rarity=r;break}}let candidates=pool.filter(p=>p.rarity===rarity);if(!candidates.length){state.cash+=price;continue}let p=candidates[Math.floor(Math.random()*candidates.length)];state.owned[p.id]=(state.owned[p.id]||0)+1;state.stats.highestRarity=Math.max(state.stats.highestRarity,rarityList.indexOf(p.rarity));pulled.push(p);state.log.unshift(`${new Date().toLocaleTimeString()} · pulled ${p.name} (${p.rarity})`)}save();refreshTop();let root=document.getElementById('modalroot'),counts={};pulled.forEach(p=>counts[p.rarity]=(counts[p.rarity]||0)+1);root.innerHTML=`<div class="revealback"><div class="revealbox" style="max-width:900px"><div class="eyebrow">bundle opening · ${pulled.length} cards</div><h2>${pulled.length} cards added to your collection</h2><div class="badge-line" style="justify-content:center">${Object.entries(counts).map(([r,n])=>`<span class="mini-badge">${r} ×${n}</span>`).join('')}</div><div class="collectiongrid" style="max-height:70vh;overflow:auto">${pulled.map(p=>cardHTML(p)).join('')}</div><button class="button" onclick="closeReveal();render()">continue</button></div></div>`}

function bind(){document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()})}
function adjustedWeights(cat){let w={...(packOdds[cat]||dailyOdds)},b=state.upgrades.luck*.015+(state.creatorLuck||0)*.01+(state.facilities.scouting||0)*.008;let low=['common','uncommon','rare'];let high=rarityList.slice(3);low.forEach((r,i)=>w[r]=Math.max(0,(w[r]||0)-b*(1-i*.25)));let totalShift=b*1.8;high.forEach((r,i)=>w[r]=(w[r]||0)+totalShift/(high.length)*(1+i*.12));return w}
function effectiveRarityWeights(cat,pool){let rank=rarityList,available=[...new Set(pool.map(p=>p.rarity))],mapped={};if(!available.length)return mapped;Object.entries(adjustedWeights(cat)).forEach(([rarity,weight])=>{if(weight<=0)return;let target=rank.indexOf(rarity);let closest=[...available].sort((a,b)=>Math.abs(rank.indexOf(a)-target)-Math.abs(rank.indexOf(b)-target))[0];mapped[closest]=(mapped[closest]||0)+weight});let total=Object.values(mapped).reduce((a,b)=>a+b,0);return Object.fromEntries(Object.entries(mapped).map(([r,w])=>[r,w/total]))}
function currentOdds(cat,team){let pool=poolFor(cat,team),mapped=effectiveRarityWeights(cat,pool);return Object.fromEntries(Object.entries(mapped).map(([r,v])=>[r,+(v*100).toFixed(2)]))}
function poolFor(cat,team){if(cat==='blastoff')return players.filter(p=>p.cat==='blastoff'&&p.team==='HOU');if(cat==='top100')return players.filter(p=>p.cat==='top100');if(cat==='retro80')return players.filter(p=>p.cat==='retro80');if(cat.startsWith('daily_'))return players.filter(p=>p.cat===cat);if(cat==='bench'||cat==='starters'){return players.filter(p=>p.cat==='rosters'&&p.team===team&&(cat==='bench'?p.role==='bench':p.role==='starter'))}if(cat==='rosters')return players.filter(p=>p.cat==='rosters'&&p.team===team);return players.filter(p=>p.cat===cat&&p.team===team)}
function openPack(cat,team){let price=packCost(cat);if(state.cash<price){toast('not enough cash');return}let pool=poolFor(cat,team);if(!pool.length){toast('no players available in this pack yet');return}let mapped=effectiveRarityWeights(cat,pool);state.cash-=price;ensureMissions();state.missions.progress.packs++;state.stats.packs++;state.season.xp+=5;let roll=Math.random(),rarity=Object.keys(mapped)[0];for(let r of Object.keys(mapped)){roll-=mapped[r];if(roll<=0){rarity=r;break}}let candidates=pool.filter(p=>p.rarity===rarity);if(cat==='top100'){let rarityCandidates=pool.filter(p=>p.rarity===rarity);candidates=rarityCandidates}if(!candidates.length){toast('pull pool error · pack refunded');state.cash+=price;refreshTop();return}let p=(cat==='top100'||cat==='retro80')?(()=>{let sum=candidates.reduce((a,c)=>a+1/(Math.pow(cat==='top100'?c.rank:cat==='retro80'?c.retroRank:c.blastoffRank,2)),0),x=Math.random()*sum;for(const c of candidates){x-=1/(Math.pow(cat==='top100'?c.rank:cat==='retro80'?c.retroRank:c.blastoffRank,2));if(x<=0)return c}return candidates[candidates.length-1]})():candidates[Math.floor(Math.random()*candidates.length)];if(cat==='blastoff'&&Math.random()<Math.min(.035,.012+(state.creatorLuck||0)*.00045)){let spaceVariant=spaceCards.find(sp=>sp.spaceRank===p.blastoffRank)||spaceCards.find(sp=>sp.name===p.name);if(spaceVariant)p=spaceVariant}state.owned[p.id]=(state.owned[p.id]||0)+1;state.stats.highestRarity=Math.max(state.stats.highestRarity,rarityList.indexOf(p.rarity));state.log.unshift(`${new Date().toLocaleTimeString()} · pulled ${p.name}${p.spaceCard?' · SPACE CARD 100 OVR':''} (${p.rarity})`);save();refreshTop();showReveal(p,cat,team,'single pack')}
function showReveal(p,cat,team,tier){if(cat==='blastoff'){blastoffOpening(p,cat,team,tier);return}showRarityReveal(p,cat,team,tier)}
function blastoffOpening(p,cat,team,tier){let root=document.getElementById('modalroot'),space=!!p.spaceCard;root.innerHTML=`<div class="revealback blastoff-cutscene"><button class="cinematic-skip" onclick="showRarityReveal(window.__pendingPull,window.__pendingCat,window.__pendingTeam,window.__pendingTier)">skip cinematic → card</button><div class="packstage"><div class="eyebrow">blast off · rockets exclusive</div><h2 style="color:#ff6672;letter-spacing:3px;text-shadow:0 0 22px #ff3344">${space?'SPACE CARD DETECTED':'BLAST OFF'}</h2><div class="blastoff-scene ${space?'space-shot':''}" id="blastscene"><div class="moon"></div><div class="hoopmoon"></div><div class="player-silhouette"></div><div class="ball"></div><div class="launchbeam"></div><div class="scene-label" id="blastlabel">${space?'player loading shot':'rocket ignition'}</div></div><div class="stagecopy" id="blastcopy">${space?'shooting for the moon':'3 · 2 · 1 · launch'}</div></div></div>`;window.__pendingPull=p;window.__pendingCat=cat;window.__pendingTeam=team;window.__pendingTier=tier;let scene=document.getElementById('blastscene'),label=document.getElementById('blastlabel'),copy=document.getElementById('blastcopy');setTimeout(()=>{if(!scene||!document.getElementById('blastscene'))return;scene.classList.add('shoot');if(label)label.textContent=space?'basketball launched':'launch sequence';if(copy)copy.textContent=space?'the ball is leaving the atmosphere':'rocket burning through the clouds'},850);setTimeout(()=>{if(!document.getElementById('blastscene'))return;if(label)label.textContent=space?'moon shot':'orbit reached';if(copy)copy.textContent=space?'ball approaching the moon':'space lock acquired'},2100);setTimeout(()=>{if(document.getElementById('blastscene'))showRarityReveal(p,cat,team,tier)},space?3900:2800)}
function retroGridCinematic(p,cat,team,tier){window.__pendingPull=p;window.__pendingCat=cat;window.__pendingTeam=team;window.__pendingTier=tier;let root=document.getElementById('modalroot');root.innerHTML=`<div class="revealback retro-grid-cinematic" id="retrogridstage"><button class="cinematic-skip" onclick="window.__retroGridDone=true;showRarityReveal(window.__pendingPull,window.__pendingCat,window.__pendingTeam,window.__pendingTier)">skip grid → card</button><div class="retro-grid-world"><div class="retro-grid-horizon"></div><div class="retro-grid-floor"></div><div class="retro-grid-card-preview">${cardHTML(p,false)}</div><div class="retro-grid-title">RETRO COLLECTION</div><div class="retro-grid-caption">80s · exclusive series</div></div></div>`;setTimeout(()=>{if(!document.getElementById('retrogridstage'))return;document.getElementById('retrogridstage').classList.add('grid-travel')},100);setTimeout(()=>{if(!document.getElementById('retrogridstage'))return;window.__retroGridDone=true;showRarityReveal(p,cat,team,tier)},3300)}
function showRarityReveal(p,cat,team,tier){if(cat==='retro80'&&!window.__retroGridDone){retroGridCinematic(p,cat,team,tier);return}if(cat==='retro80'&&window.__retroGridDone)window.__retroGridDone=false;window.__pendingPull=p;window.__pendingCat=cat;window.__pendingTeam=team;window.__pendingTier=tier;let rank=rarityList.indexOf(p.rarity),safeRank=Math.max(0,rank),totalSteps=safeRank+1,delay=rank>=13?8500:rank>=11?6500:rank>=9?4800:rank>=7?3600:rank>=5?2600:Math.max(950,1800*(1-state.upgrades.packSpeed*.08)),stepTime=Math.max(125,Math.min(310,delay/totalSteps));let root=document.getElementById('modalroot');root.innerHTML=`<div class="revealback rarity-cutscene r-${p.rarity.replace(/ /g,'-')} ${cat==='retro80'?'retro-cutscene':cat==='blastoff'?'blastoff-cutscene':' '}" id="cutscene"><button class="cinematic-skip" onclick="showFinalPullNow()">skip rarity animation → card</button><div class="packstage opening"><div class="eyebrow">${(categories.find(c=>c.id===cat)?.name||dailyPackThemes.find(c=>'daily_'+c.id===cat)?.name||cat)} · ${team==='ALL'?'all teams':(teams.find(t=>t[0]===team)?.[1]||team)}</div><div class="cutscene-rarity rarity-step r-common thump" id="raritystep">COMMON</div><div class="rarity-count" id="raritycount">rarity 1 / ${totalSteps}</div><div class="packvisual ${cat==='retro80'?'retro-packvisual':cat==='blastoff'?'blastoff-packvisual':' '}" ><div class="packfoil"><div class="foilshine"></div></div></div><div class="scan"></div><div class="stagecopy" id="stagecopy">opening pack…</div><div class="cutscene-progress"><span id="cutprogress"></span></div><div class="sub">each thump gets louder in your head</div></div></div>`;let current=0,interval=setInterval(()=>{let badge=document.getElementById('raritystep'),count=document.getElementById('raritycount'),copy=document.getElementById('stagecopy'),bar=document.getElementById('cutprogress');if(!badge){clearInterval(interval);return}if(current>=safeRank){clearInterval(interval);return}current++;let r=rarityList[current],cls='r-'+r.replace(/ /g,'-');badge.textContent=r.toUpperCase();badge.className='cutscene-rarity rarity-step '+cls+' thump';if(count)count.textContent=`rarity ${current+1} / ${totalSteps}`;if(copy)copy.textContent=current===safeRank?'final rarity confirmed':'rarity upgrade detected';if(bar)bar.style.width=((current+1)/totalSteps*100)+'%';setTimeout(()=>badge.classList.remove('thump'),390)},stepTime);let finalDelay=Math.max(1000,stepTime*totalSteps+350);setTimeout(()=>{clearInterval(interval);let root=document.getElementById('modalroot');if(!root)return;root.innerHTML=`<div class="revealback reveal-final r-${p.rarity.replace(/ /g,'-')}" id="finalreveal"><div class="revealbox"><div class="eyebrow">${(categories.find(c=>c.id===cat)?.name||dailyPackThemes.find(c=>'daily_'+c.id===cat)?.name||cat)}</div><h2 class="final-title">${p.spaceCard?'100 OVR · SPACE CARD':rank>=13?'transcendent pull':rank>=11?'immortal pull':rank>=9?'elite pull':rank>=7?'legendary pull':'you pulled'}</h2><div class="card-reveal">${cardHTML(p)}</div><p class="sub" style="color:#8de0a2;font-weight:800">✓ card saved to your collection</p><p class="sub">${state.owned[p.id]>1?'duplicate · ×'+state.owned[p.id]:'new card added to collection'}</p><button class="button" onclick="closeReveal();render()">continue</button><button class="button secondary" style="margin-left:7px" onclick="closeReveal();equip('${p.id}');render()">equip card</button></div></div>`},finalDelay)}
function showFinalPullNow(){let p=window.__pendingPull,cat=window.__pendingCat,team=window.__pendingTeam;if(!p)return;let rank=rarityList.indexOf(p.rarity);let root=document.getElementById('modalroot');if(!root)return;root.innerHTML=`<div class="revealback reveal-final r-${p.rarity.replace(/ /g,'-')}" id="finalreveal"><div class="revealbox"><div class="eyebrow">${(categories.find(c=>c.id===cat)?.name||dailyPackThemes.find(c=>'daily_'+c.id===cat)?.name||cat)}</div><h2 class="final-title">${p.spaceCard?'100 OVR · SPACE CARD':rank>=13?'transcendent pull':rank>=11?'immortal pull':rank>=9?'elite pull':rank>=7?'legendary pull':'you pulled'}</h2><div class="card-reveal">${cardHTML(p)}</div><p class="sub">${state.owned[p.id]>1?'duplicate · ×'+state.owned[p.id]:'new card added to collection'}</p><p class="sub" style="color:#8de0a2;font-weight:800">✓ card saved to your collection</p><button class="button" onclick="closeReveal();render()">continue</button><button class="button secondary" style="margin-left:7px" onclick="closeReveal();equip('${p.id}');render()">equip card</button></div></div>`}
function closeReveal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalroot').innerHTML=''}
function equip(id){if(!state.owned[id])return;let idx=state.roster.indexOf(id);if(idx>=0){toast('already equipped');return}let empty=state.roster.findIndex(x=>!x);if(empty<0){toast('roster full — remove a card first');return}state.roster[empty]=id;save();render();toast('card equipped')}
function unequip(i){state.roster[i]=null;save();render()}
function autoRoster(){let cards=Object.keys(state.owned).map(getCard).sort((a,b)=>incomeOf(b)-incomeOf(a));state.roster=Array(10).fill(null);cards.slice(0,10).forEach((p,i)=>state.roster[i]=p.id);save();render();toast('best income roster equipped')}
function clearRoster(){state.roster=Array(10).fill(null);save();render();toast('lineup cleared')}
function buyUpgrade(id,cost,max){if(state.cash<cost||state.upgrades[id]>=max)return;state.cash-=cost;state.upgrades[id]++;save();render();toast('upgrade purchased')}
function resetGame(){if(!confirm('reset all game progress? this cannot be undone'))return;localStorage.removeItem('nbaCardEmpireSave');state=fresh();save();render();toast('new game started')}
function offline(){let now=Date.now(),elapsed=Math.max(0,(now-(state.last||now))/1000);let cap=(2+state.upgrades.offline)*3600;let earned=rosterIncome()*Math.min(elapsed,cap);if(elapsed>90&&earned>0){state.cash+=earned;setTimeout(()=>alert(`welcome back\n\n${fmt(earned)} earned while away (${Math.floor(Math.min(elapsed,cap)/3600)}h ${Math.floor(Math.min(elapsed,cap)%3600/60)}m counted)`),500)}state.last=now;save()}
// initial offline calculation must use saved roster and upgrades before last timestamp is reset
let now=Date.now(),offSeconds=Math.max(0,(now-(state.last||now))/1000),offCap=(2+state.upgrades.offline)*3600,offEarn=rosterIncome()*Math.min(offSeconds,offCap);if(offSeconds>90&&offEarn>0){state.cash+=offEarn;setTimeout(()=>alert(`welcome back\n\n${fmt(offEarn)} earned while away`),500)}state.last=now;save();render();loadHeadshotCrosswalk();setInterval(()=>{state.cash+=rosterIncome();state.last=Date.now();save();refreshTop();if(currentTab==='dailyshop'&&Date.now()%1800000<1100)render()},1000);
